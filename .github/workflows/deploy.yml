name: CI/CD - Docker Build & Push

on:
  push:
    branches:
      - Kien

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t kienn11/manage-film-website:latest \
            -t kienn11/manage-film-website:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push kienn11/manage-film-website:latest
          docker push kienn11/manage-film-website:${{ github.sha }}
